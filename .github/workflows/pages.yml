name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/top-traders-dashboard-bmzuko]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Provisions the Pages site on the first run instead of failing with
          # "Get Pages site failed" when Pages has never been turned on.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
