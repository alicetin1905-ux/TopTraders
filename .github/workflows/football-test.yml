name: Test football data source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run football refresh
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          echo "RAPIDAPI_KEY is set: $([ -n "$RAPIDAPI_KEY" ] && echo yes || echo no)"
          node scripts/football-refresh.mjs

      - name: Report result
        run: |
          node -e '
            const d = require("./docs/football/data/fixtures.json");
            console.log("source:", d.source);
            console.log("fixture count:", d.fixtures.length);
            console.log("sample:", JSON.stringify(d.fixtures.slice(0, 3).map(f => ({
              league: f.league, home: f.home.name, away: f.away.name, date: f.date, combined: f.score.combined,
            })), null, 2));
          '
